<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дом света</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07080a;overflow:hidden;font-family:Arial,sans-serif;color:#eee}
  canvas{display:block}
  #cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;border-radius:50%;opacity:.7;pointer-events:none}
  #load{position:fixed;left:50%;top:50%;transform:translate(-50%,24px);font-size:12px;color:#aaa;letter-spacing:.1em}
  [hidden]{display:none!important}
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"}}</script>
<script src="photos.js"></script>
<script src="scan/house.js"></script>
<script src="scan/blocking.js"></script>
</head>
<body>
<div id="cross"></div>
<div id="load">загрузка…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {computeBoundsTree, acceleratedRaycast} from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;
RectAreaLightUniformsLib.init();

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const SKY = 0x07080a;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 10, 45);
scene.add(new THREE.HemisphereLight(0x8a94a6, 0x2a2622, 0.5));

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';

// Coordinates: Blender (x, y, z-up) -> here (x, z, -y). House floor 1 is at y = 0.
const EYE = 1.32, R = 0.3, STEP_UP = 0.6;
const colliders = [];                       // meshes we walk on / bump into

// endless dark ground under the scanned plot
const groundMat = new THREE.MeshStandardMaterial({color:0x2c2f2a, roughness:1});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -1.15; scene.add(ground); colliders.push(ground);


async function loadGLB(b64){
  const buf = await (await fetch('data:application/octet-stream;base64,'+b64)).arrayBuffer();
  return new Promise((ok, bad) => new GLTFLoader().parse(buf, '', ok, bad));
}

// ---------- photos ----------
const loader = new THREE.TextureLoader();
const textures = (window.PHOTOS||[]).map(src => {
  const t = loader.load(src, tex => { cover16x9(tex); avgColor(tex); });
  t.colorSpace = THREE.SRGBColorSpace; t.userData.color = new THREE.Color(0xffe8c8);
  return t;
});
function avgColor(t){
  const c = document.createElement('canvas'); c.width = c.height = 4;
  const g = c.getContext('2d'); g.drawImage(t.image,0,0,4,4);
  const d = g.getImageData(0,0,4,4).data; let r=0,gg=0,b=0;
  for (let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2];}
  const n=d.length/4; t.userData.color.setRGB(r/n/255,gg/n/255,b/n/255,THREE.SRGBColorSpace);
  const hsl={}; t.userData.color.getHSL(hsl); t.userData.color.setHSL(hsl.h, Math.min(1,hsl.s*1.3), 0.6);
}
const ASPECT = 16/9, SMALL_W = 0.34, BIG_W = 2.4;
function cover16x9(t){
  const a = t.image.width/t.image.height;
  if (a > ASPECT){ t.repeat.set(ASPECT/a,1); t.offset.set((1-ASPECT/a)/2,0); }
  else { t.repeat.set(1,a/ASPECT); t.offset.set(0,(1-a/ASPECT)/2); }
}
const panels = [];
const rnd = (a,b)=>a+Math.random()*(b-a);
function addPanel(x,y,z,rot,phase){
  const tex = textures.length ? textures[panels.length % textures.length] : null;
  const mat = new THREE.MeshBasicMaterial({map:tex, color:0xffffff, side:THREE.DoubleSide, toneMapped:false});
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
  const g = new THREE.Group(); g.add(mesh); scene.add(g);
  panels.push({x, z, y, phase, rot, g, mesh, mat, tex, level:0, open:false});
}

// Light slots for open photos. Each slot = a soft area light on BOTH faces of the photo
// (photos hang free in space, so they shine both ways) + a gentle omni glow for the room.
// A photo keeps its slot until it has fully faded, so lights never jump between photos.
const POOL = 6, slots = [];
const flipY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI);
for (let i=0;i<POOL;i++){
  const front = new THREE.RectAreaLight(0xffffff,0,1,1), back = new THREE.RectAreaLight(0xffffff,0,1,1);
  const glow = new THREE.PointLight(0xffffff, 0, 9, 2);
  scene.add(front, back, glow);
  slots.push({front, back, glow, panel:null});
}
const WARM = new THREE.Color(0xffe2c0), lightCol = new THREE.Color();

// ---------- raycasting helpers ----------
const rc = new THREE.Raycaster(); rc.firstHitOnly = true;
const DOWN = new THREE.Vector3(0,-1,0);
function floorBelow(x, yTop, z, far=40){
  rc.set(new THREE.Vector3(x,yTop,z), DOWN); rc.far = far;
  const h = rc.intersectObjects(colliders, false)[0];
  return h ? h.point.y : -1.15;
}
function blocked(from, dir, dist){
  rc.set(from, dir); rc.far = dist;
  return rc.intersectObjects(colliders, false).length > 0;
}
// is a spot inside the house footprint (+margin)? Blender footprint x -11.4..3.1, y 6.1..19.8
const inHouse = (x,z,m=0) => x>-11.4-m && x<3.1+m && z>-19.8-m && z<-6.1+m;

// ---------- load scan + blocking, then place photos ----------
Promise.all([loadGLB(window.SCAN_B64), loadGLB(window.BLOCK_B64)]).then(([scan, block]) => {
  // one flat grey for everything: the scan and the blocking
  const grey = new THREE.MeshStandardMaterial({color:0xa9a7a3, roughness:1, metalness:0});
  const greyScan = grey.clone(); greyScan.side = THREE.DoubleSide;
  scan.scene.traverse(o => { if (o.isMesh){
    o.material = greyScan; o.geometry.computeBoundsTree(); colliders.push(o);
  }});
  scene.add(scan.scene);
  block.scene.traverse(o => { if (o.isMesh){
    o.material = grey; o.geometry.computeBoundsTree(); colliders.push(o);
  }});
  scene.add(block.scene); blockRoot = block.scene;
  scene.updateMatrixWorld(true);

  // photos outside: dashes along winding lines over the plot, around the house
  for (let line=0; line<7; line++){
    const pts = [];
    let x = rnd(-20,9), z = rnd(-32,4), dir = Math.random()*6.28;
    for (let k=0; k<6; k++){
      pts.push(new THREE.Vector3(x, 0, z));
      dir += rnd(-1,1);
      x = THREE.MathUtils.clamp(x+Math.cos(dir)*6, -21, 10);
      z = THREE.MathUtils.clamp(z+Math.sin(dir)*6, -33, 6);
    }
    const curve = new THREE.CatmullRomCurve3(pts), n = Math.floor(curve.getLength()/1.6);
    for (let s=0; s<=n; s++){
      const u=s/n, P=curve.getPointAt(u), T=curve.getTangentAt(u);
      if (inHouse(P.x,P.z,1.2) || panels.some(p=>Math.hypot(p.x-P.x,p.z-P.z)<1.3)) continue;
      addPanel(P.x, floorBelow(P.x,12,P.z)+rnd(1.4,2.2), P.z, Math.atan2(-T.z,T.x), u*12+line);
    }
  }
  // photos inside, floor 1: scattered in the rooms
  for (let i=0, tries=0; i<14 && tries<400; tries++){
    const x=rnd(-8.3,2.4), z=rnd(-17,-7);
    const f = floorBelow(x, 3.2, z, 4);
    if (Math.abs(f) > 0.15 || panels.some(p=>Math.hypot(p.x-x,p.z-z)<1.4)) continue;   // only open floor, not furniture
    addPanel(x, rnd(1.3,1.8), z, Math.floor(Math.random()*4)*Math.PI/2, Math.random()*6); i++;
  }
  document.getElementById('load').hidden = true;
  ready = true;
}).catch(e => { document.getElementById('load').textContent = 'ошибка загрузки: '+e.message; console.error(e); });

// ---------- controls (FPS) ----------
const canvas = renderer.domElement;
let ready = false, blockRoot = null, lastGround = -0.6;
let yaw = -Math.PI/2, pitch = 0, locked = false;       // start in front of the porch, facing the door
const pos = new THREE.Vector3(-13.2, -0.4, -14.3), vel = new THREE.Vector3(); let onGround = false;
const keys = new Set();
let aimedPanel = null;
const OPEN_HOLD = 5;   // seconds a photo stays open before it slowly folds back
function press(){ if (!aimedPanel) return; aimedPanel.open = !aimedPanel.open; aimedPanel.openedAt = clock.elapsedTime; }
canvas.onclick = () => { if (!locked) canvas.requestPointerLock(); else press(); };
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === canvas; keys.clear(); });
document.addEventListener('mousemove', e => {
  if (!locked) return;
  yaw -= e.movementX*0.0022; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY*0.0022));
});
addEventListener('keydown', e => { keys.add(e.code); if (e.code==='Space') e.preventDefault(); if (e.code==='KeyE' && !e.repeat) press(); });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), dirv = new THREE.Vector3(), from = new THREE.Vector3();
function tryMove(axis, d){
  if (!d) return;
  dirv.set(axis==='x'?Math.sign(d):0, 0, axis==='z'?Math.sign(d):0);
  const dist = Math.abs(d) + R;
  for (const hgt of [STEP_UP+0.05, 1.2, 1.75]){
    from.set(pos.x, pos.y+hgt, pos.z);
    if (blocked(from, dirv, dist)){ vel[axis] = 0; return; }
  }
  pos[axis] += d;
}

// ---------- loop ----------
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  if (ready){
    const f = (keys.has('KeyW')||keys.has('ArrowUp')) - (keys.has('KeyS')||keys.has('ArrowDown'));
    const s = (keys.has('KeyD')||keys.has('ArrowRight')) - (keys.has('KeyA')||keys.has('ArrowLeft'));
    const speed = (keys.has('ShiftLeft')||keys.has('ShiftRight')) ? 1.5 : 3.2;
    const wx = -Math.sin(yaw)*f + Math.cos(yaw)*s, wz = -Math.cos(yaw)*f - Math.sin(yaw)*s;
    const len = Math.hypot(wx,wz)||1, k = onGround ? 12 : 2;
    vel.x += ((wx/len)*speed*(f||s?1:0) - vel.x)*Math.min(1,k*dt);
    vel.z += ((wz/len)*speed*(f||s?1:0) - vel.z)*Math.min(1,k*dt);
    if (keys.has('Space') && onGround){ vel.y = 5.0; onGround = false; }
    vel.y -= 16*dt;
    tryMove('x', vel.x*dt); tryMove('z', vel.z*dt);
    pos.y += vel.y*dt;
    // the scan's ground has holes: if the ray only finds the fallback plane far below,
    // keep walking at the last real ground height instead of dropping through
    let g = floorBelow(pos.x, pos.y+STEP_UP, pos.z);
    if (g <= -1.14 && lastGround > -1.1) g = lastGround; else if (onGround) lastGround = g;
    if (pos.y <= g + 0.02 && vel.y <= 0){
      // walk up small steps smoothly, snap down onto slopes
      pos.y = THREE.MathUtils.damp(pos.y, g, 18, dt); if (Math.abs(pos.y-g)<0.01) pos.y=g;
      vel.y = 0; onGround = true;
    } else if (onGround && pos.y - g < 0.35 && vel.y <= 0){ pos.y = g; vel.y = 0; }
    else onGround = false;
  }
  camera.position.set(pos.x, pos.y+EYE, pos.z);
  camera.rotation.set(pitch, yaw, 0);
  // grey blocking pokes through the scanned facade, so it is drawn only from inside
  // (it still collides everywhere)
  if (blockRoot) blockRoot.visible = inHouse(pos.x, pos.z, -0.15);

  // forgiving aim: nearest panel within a cone around the crosshair
  camera.getWorldDirection(fwd);
  let best = null, bestA = 1e9;
  for (const p of panels){
    tmp.set(p.x - camera.position.x, p.g.position.y - camera.position.y, p.z - camera.position.z);
    const dist = tmp.length(), ang = fwd.angleTo(tmp);
    if (dist > 16) continue;
    const tol = 0.07 + Math.atan((SMALL_W + p.level*BIG_W)/2/dist);
    if (ang < tol && ang < bestA){ best = p; bestA = ang; }
  }
  aimedPanel = best;

  for (const p of panels){
    // click / E on the aimed photo opens it, again closes it (closing fades slowly)
    if (p.open && t - p.openedAt > OPEN_HOLD) p.open = false;
    p.level += ((p.open?1:0) - p.level) * Math.min(1, (p.open ? 7 : 0.7)*dt);
    const L = p.level;
    const e = L<=0 ? 0 : L>=1 ? 1 : 1 + 2.2*Math.pow(L-1,3) + 1.2*Math.pow(L-1,2);
    const w = THREE.MathUtils.lerp(SMALL_W, BIG_W, e);
    p.mesh.scale.set(w, w/ASPECT, 1);
    p.g.rotation.y = p.rot;
    p.g.position.set(p.x, p.y + Math.sin(t*0.9+p.phase)*0.08*(1-L) + L*0.15, p.z);
    p.mat.color.setScalar(0.6 + L*0.9 + (p === aimedPanel && !p.open ? 0.8 : 0));
  }

  // release slots of faded photos, give free slots to newly opened ones
  for (const sl of slots) if (sl.panel && sl.panel.level < 0.01 && !sl.panel.open){ sl.panel.slot = null; sl.panel = null; }
  for (const p of panels) if (p.open && !p.slot){
    let sl = slots.find(x => !x.panel);
    if (!sl) sl = slots.reduce((a,b) => (a.panel.level < b.panel.level ? a : b));   // steal the dimmest
    if (sl.panel) sl.panel.slot = null;
    sl.panel = p; p.slot = sl;
  }
  for (const sl of slots){
    const p = sl.panel;
    if (!p){ sl.front.intensity = sl.back.intensity = sl.glow.intensity = 0; continue; }
    const L = p.level, w = p.mesh.scale.x, h = p.mesh.scale.y;
    lightCol.copy(p.tex?.userData.color || WARM).lerp(WARM, 0.45);
    for (const [l, q] of [[sl.front, null], [sl.back, flipY]]){
      l.width = w; l.height = h; l.color.copy(lightCol);
      l.position.copy(p.g.position);
      l.quaternion.copy(p.g.quaternion); if (q === null) l.quaternion.multiply(flipY);
      l.intensity = L * 9;
    }
    sl.glow.position.copy(p.g.position); sl.glow.color.copy(lightCol);
    sl.glow.intensity = L * 2.5;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
